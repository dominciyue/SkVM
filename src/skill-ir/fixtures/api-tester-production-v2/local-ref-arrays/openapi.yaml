openapi: 3.1.0
info:
  title: Local Ref Arrays API
  version: 1.0.0
components:
  schemas:
    Tag:
      type: string
      enum: [weather, marine, energy]
    TagList:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Tag'
    ItemName:
      type: string
      minLength: 2
      maxLength: 40
    NewItem:
      type: object
      required: [name, tags]
      properties:
        name:
          $ref: '#/components/schemas/ItemName'
        tags:
          $ref: '#/components/schemas/TagList'
        publishedOn:
          type: string
          format: date
        score:
          type: number
          format: float
  parameters:
    TagsFilter:
      name: tags
      in: query
      style: form
      explode: false
      schema:
        $ref: '#/components/schemas/TagList'
  requestBodies:
    NewItemBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewItem'
paths:
  /items:
    get:
      parameters:
        - $ref: '#/components/parameters/TagsFilter'
      responses:
        '200': { description: Items }
        '400': { description: Bad filter }
    post:
      requestBody:
        $ref: '#/components/requestBodies/NewItemBody'
      responses:
        '201': { description: Created }
        '400': { description: Invalid item }
